name: rijksmuseum-pipeline

on:
  workflow_dispatch
  # schedule:
  # # run tests once every week
  # - cron: "0 0 * * Mon"

jobs:
  test:
    name: Test Rijksmuseum API
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore RijksmuseumApiTest.csproj
    - name: Build
      run: dotnet build RijksmuseumApiTest.csproj --no-restore
    # TODO: Publish test results (--logger trx + actions/upload-artifact) so failures are inspectable
    #       from the Actions UI without re-running.
    - name: Test
      run: dotnet test RijksmuseumApiTest.csproj --no-build --verbosity normal
